<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><style>
@font-face{font-family:"F";src:url("cover-font-zt.ttf") format("truetype");}
html,body{width:1536px;height:864px;margin:0;padding:0;overflow:hidden;}
body{background:linear-gradient(140deg,#c6d8ff 0%,#dccbff 46%,#ffe2c6 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;perspective:1200px;}
body::before{content:"";position:absolute;inset:-80px;background:
 radial-gradient(420px 320px at 14% 22%,rgba(255,255,255,.85),transparent 70%),
 radial-gradient(520px 360px at 86% 72%,rgba(255,196,140,.65),transparent 70%),
 radial-gradient(340px 260px at 66% 12%,rgba(176,216,255,.6),transparent 70%);}
.block{transform-origin:50% 50%;transform:translateY(26px) scaleX(1.12) perspective(1400px) rotateX(9deg);display:flex;flex-direction:column;align-items:center;z-index:2;}
.t1wrap{position:relative;line-height:1.24;white-space:nowrap;}
.stroke{font-family:"F",serif;font-size:248px;color:#fff;-webkit-text-stroke:14px #fff;letter-spacing:10px;display:block;white-space:nowrap;filter:drop-shadow(0 12px 16px rgba(30,40,90,.30));}
.fill{position:absolute;left:0;top:0;font-family:"F",serif;font-size:248px;letter-spacing:10px;display:block;white-space:nowrap;width:100%;}
.t2wrap{position:relative;margin-top:6px;line-height:1.3;white-space:nowrap;transform-origin:50% 50%;}
.t2s{font-family:"F",serif;font-size:84px;color:#fff;-webkit-text-stroke:7px #fff;letter-spacing:4px;display:block;white-space:nowrap;filter:drop-shadow(0 8px 12px rgba(30,40,90,.28));}
.t2f{position:absolute;left:0;top:0;font-family:"F",serif;font-size:84px;color:#FF6A00;letter-spacing:4px;display:block;white-space:nowrap;}
.t3{font-family:"F",serif;font-size:38px;color:#3A3358;letter-spacing:2px;margin-top:16px;white-space:nowrap;transform-origin:50% 50%;text-shadow:0 1px 0 rgba(255,255,255,.95),0 0 16px rgba(255,255,255,.85);}
</style></head><body>
<div class="block">
<div class="t1wrap"><span class="stroke">液态玻璃</span><span class="fill"><span style="color:#0A84FF;">液</span><span style="color:#5E5CE6;">态</span><span style="color:#FF9F0A;">玻</span><span style="color:#30D158;">璃</span></span></div>
<div class="t2wrap"><span class="t2s">MacDock · Windows 11 · 仿 macOS · 仅 1.5MB</span><span class="t2f">MacDock · Windows 11 · 仿 macOS · 仅 1.5MB</span></div>
<div class="t3">灵动岛 · 3D 台前调度 · Genie 漏斗 · 控制中心 · 8 款桌面组件</div>
</div>
<script>
window.addEventListener('load', function(){
  var TARGET = 1200;
  ['.t2wrap','.t3'].forEach(function(sel){
    var el = document.querySelector(sel);
    var w = el.offsetWidth;
    if(w>0){ el.style.transform = 'scaleX(' + (TARGET / w) + ')'; }
  });
});
</script>
</body></html>
