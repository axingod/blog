<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><style>
*{box-sizing:border-box;}
html,body{margin:0;padding:0;width:1440px;height:400px;overflow:hidden;font-family:"Microsoft YaHei","PingFang SC",sans-serif;}
.wrap{position:relative;width:1440px;height:400px;overflow:hidden;
background:
 radial-gradient(900px 500px at 78% 20%,#1d3a6b 0%,rgba(29,58,107,0) 62%),
 radial-gradient(700px 420px at 8% 90%,#123049 0%,rgba(18,48,73,0) 70%),
 linear-gradient(120deg,#0b0f17 0%,#0f1826 45%,#101a2b 100%);}
.stars{position:absolute;inset:0;}
.stars i{position:absolute;background:#cfe3ff;border-radius:50%;opacity:.55;box-shadow:0 0 6px rgba(207,227,255,.7);}
.txt{position:absolute;left:72px;top:96px;z-index:5;}
.txt h1{margin:0;font-size:56px;line-height:1.34;color:#f4f8ff;font-weight:800;letter-spacing:1px;text-shadow:0 6px 22px rgba(0,0,0,.6);}
.txt p{margin:16px 0 0;font-size:20px;color:#93a6c4;letter-spacing:.6px;}
.icons{position:absolute;inset:0;z-index:4;}
.card{position:absolute;border-radius:24%;display:flex;align-items:center;justify-content:center;
box-shadow:0 22px 44px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.18);}
.card img{width:58%;height:58%;object-fit:contain;filter:drop-shadow(0 3px 6px rgba(0,0,0,.25));}
@keyframes floaty{0%{transform:translateY(0) rotate(var(--r));}50%{transform:translateY(-16px) rotate(calc(var(--r) + 2deg));}100%{transform:translateY(0) rotate(var(--r));}}
.card{animation:floaty var(--d,6s) ease-in-out infinite;animation-delay:var(--dl,0s);}
</style></head><body>
<div class="wrap">
  <div class="stars" id="stars"></div>
  <div class="icons">
    <div class="card" style="--r:-14deg;--d:7s;--dl:.2s;left:1190px;top:-46px;width:190px;height:190px;background:linear-gradient(145deg,#2d7ff9,#1b5ed8);"><img src="https://cdn.simpleicons.org/vuedotjs/ffffff"></div>
    <div class="card" style="--r:10deg;--d:6.4s;--dl:.9s;left:1010px;top:96px;width:168px;height:168px;background:linear-gradient(145deg,#ffffff,#e9eefb);"><img src="https://cdn.simpleicons.org/python/3776AB" style="width:52%;height:52%;"></div>
    <div class="card" style="--r:-8deg;--d:5.8s;--dl:1.6s;left:1240px;top:196px;width:176px;height:176px;background:linear-gradient(145deg,#20232a,#12151b);"><img src="https://cdn.simpleicons.org/react/61dafb"></div>
    <div class="card" style="--r:16deg;--d:6.8s;--dl:.6s;left:838px;top:120px;width:150px;height:150px;background:linear-gradient(145deg,#2f3a4f,#1a2130);"><img src="https://cdn.simpleicons.org/nodedotjs/8cc84b"></div>
    <div class="card" style="--r:-20deg;--d:7.4s;--dl:1.2s;left:1046px;top:280px;width:180px;height:180px;background:linear-gradient(145deg,#9b6bff,#6d3fe0);"><img src="https://cdn.simpleicons.org/git/ffffff"></div>
    <div class="card" style="--r:12deg;--d:6.2s;--dl:.4s;left:660px;top:270px;width:146px;height:146px;background:linear-gradient(145deg,#0e83cd,#0a5f96);"><img src="https://cdn.simpleicons.org/hexo/ffffff"></div>
    <div class="card" style="--r:-6deg;--d:7.1s;--dl:1.8s;left:1290px;top:74px;width:120px;height:120px;background:linear-gradient(145deg,#f38020,#d9620a);"><img src="https://cdn.simpleicons.org/cloudflare/ffffff"></div>
  </div>
  <div class="txt">
    <h1>wulitou 胖虎<br>一个菜鸟的折腾记录</h1>
    <p>wulitou-blog · 记录每一次踩坑</p>
  </div>
</div>
<script>
var s=document.getElementById('stars'),h='';
for(var i=0;i<90;i++){
  var x=Math.random()*100,d=Math.random()*1.6+.8,o=Math.random()*.6+.25;
  h+='<i style="left:'+x.toFixed(2)+'%;top:'+(Math.random()*100).toFixed(2)+'%;width:'+d.toFixed(1)+'px;height:'+d.toFixed(1)+'px;opacity:'+o.toFixed(2)+';"></i>';
}
s.innerHTML=h;
</script>
</body></html>
