<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><style>
@font-face{font-family:"F";src:url("cover-font-zt.ttf") format("truetype");}
html,body{width:1536px;height:864px;margin:0;padding:0;overflow:hidden;}
body{background:linear-gradient(140deg,#b3f0d6 0%,#c7e9ff 48%,#e2f7c9 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;perspective:1200px;}
body::before{content:"";position:absolute;inset:-80px;background:
 radial-gradient(420px 320px at 14% 22%,rgba(255,255,255,.85),transparent 70%),
 radial-gradient(520px 360px at 86% 72%,rgba(255,196,140,.65),transparent 70%),
 radial-gradient(340px 260px at 66% 12%,rgba(176,216,255,.6),transparent 70%);}
.block{transform-origin:50% 50%;transform:translateY(26px) scaleX(1.12) perspective(1400px) rotateX(9deg);display:flex;flex-direction:column;align-items:center;z-index:2;}
.t1wrap{position:relative;line-height:1.24;white-space:nowrap;}
.stroke{font-family:"F",serif;font-size:248px;color:#fff;-webkit-text-stroke:14px #fff;letter-spacing:10px;display:block;white-space:nowrap;filter:drop-shadow(0 12px 16px rgba(90,50,0,.30));}
.fill{position:absolute;left:0;top:0;font-family:"F",serif;font-size:248px;letter-spacing:10px;display:block;white-space:nowrap;width:100%;}
.t2wrap{position:relative;margin-top:6px;line-height:1.3;white-space:nowrap;transform-origin:50% 50%;}
.t2s{font-family:"F",serif;font-size:84px;color:#fff;-webkit-text-stroke:7px #fff;letter-spacing:4px;display:block;white-space:nowrap;filter:drop-shadow(0 8px 12px rgba(90,50,0,.28));}
.t2f{position:absolute;left:0;top:0;font-family:"F",serif;font-size:84px;color:#FF6A00;letter-spacing:4px;display:block;white-space:nowrap;}
.t3{font-family:"F",serif;font-size:38px;color:#4A3620;letter-spacing:2px;margin-top:16px;white-space:nowrap;transform-origin:50% 50%;text-shadow:0 1px 0 rgba(255,255,255,.95),0 0 16px rgba(255,255,255,.85);}
</style></head><body>
<div class="block">
<div class="t1wrap"><span class="stroke">建站实录</span><span class="fill"><span style="color:#FFD43B;">建</span><span style="color:#2EC4F1;">站</span><span style="color:#4CD964;">实</span><span style="color:#FF5E3A;">录</span></span></div>
<div class="t2wrap"><span class="t2s">Hexo · AnzhiYu · GitHub · 一台电脑就够</span><span class="t2f">Hexo · AnzhiYu · GitHub · 一台电脑就够</span></div>
<div class="t3">保姆级实录 · 踩坑全记录 · 零基础可跟 · 一个下午 · 从零到能访问</div>
</div>
<script>
window.addEventListener('load', function(){
  var TARGET = 1200;
  ['.t2wrap','.t3'].forEach(function(sel){
    var el = document.querySelector(sel);
    var w = el.offsetWidth;
    if(w>0){ el.style.transform = 'scaleX(' + (TARGET / w) + ')'; }
  });
});
</script>
</body></html>
