<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><style>
@font-face{font-family:"F";src:url("cover-font-zt.ttf") format("truetype");}
html,body{width:1536px;height:864px;margin:0;padding:0;overflow:hidden;}
body{background:linear-gradient(140deg,#a9c9ff 0%,#d7c6ff 42%,#ffd9b6 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;perspective:1200px;}
body::before{content:"";position:absolute;inset:-80px;background:
 radial-gradient(420px 320px at 14% 22%,rgba(255,255,255,.85),transparent 70%),
 radial-gradient(520px 360px at 86% 72%,rgba(255,196,140,.65),transparent 70%),
 radial-gradient(340px 260px at 66% 12%,rgba(176,216,255,.6),transparent 70%);}
.block{transform-origin:50% 50%;transform:scaleX(1.14);display:flex;flex-direction:column;align-items:center;z-index:2;}
.t1wrap{position:relative;line-height:1.24;white-space:nowrap;}
.stroke{font-family:"F",serif;font-size:248px;color:#fff;-webkit-text-stroke:14px #fff;letter-spacing:10px;display:block;white-space:nowrap;filter:drop-shadow(0 12px 16px rgba(90,50,0,.30));}
.fill{position:absolute;left:0;top:0;font-family:"F",serif;font-size:248px;letter-spacing:10px;display:block;white-space:nowrap;width:100%;}
.t2wrap{position:relative;margin-top:8px;line-height:1.3;white-space:nowrap;}
.t2s{font-family:"F",serif;font-size:70px;color:#fff;-webkit-text-stroke:7px #fff;letter-spacing:5px;display:block;white-space:nowrap;filter:drop-shadow(0 8px 12px rgba(90,50,0,.28));}
.t2f{position:absolute;left:0;top:0;font-family:"F",serif;font-size:70px;color:#FF6A00;letter-spacing:5px;display:block;white-space:nowrap;}
.t3{font-family:"F",serif;font-size:32px;color:#4A3620;letter-spacing:2px;margin-top:22px;white-space:nowrap;text-shadow:0 1px 0 rgba(255,255,255,.95),0 0 16px rgba(255,255,255,.85);}
</style></head><body>
<div class="block">
<div class="t1wrap"><span class="stroke">你好世界</span><span class="fill"><span style="color:#FFD43B;">你</span><span style="color:#2EC4F1;">好</span><span style="color:#4CD964;">世</span><span style="color:#FF5E3A;">界</span></span></div>

</body></html>
